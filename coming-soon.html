<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rooted Rupees — Coming Soon</title>
<meta name="description" content="Rooted Rupees is on its way. Investment advisory, research, financial planning and smart tools — everything you need to make confident financial decisions.">
<link rel="icon" href="assets/images/logo-mark.jpg">

<style>
  @import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --cream:      #F7F2E7;
    --cream-deep: #F1EADA;
    --paper:      #FFFEFC;
    --ink:        #2A2B22;
    --ink-soft:   #5B5C4F;
    --pine:       #1E3A2B;
    --pine-deep:  #142A1E;
    --sage:       #DCE3D3;
    --gold:       #B8862E;
  }

  *,*::before,*::after{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0; background: var(--cream); color: var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    display:flex; align-items:center; justify-content:center;
    padding: 24px;
    position: relative; overflow:hidden;
  }

  /* faint decorative ring, echoes the hero mark on the main site */
  .ring{
    position:absolute; width: min(72vw, 640px); aspect-ratio:1/1; border-radius:50%;
    border:1px solid rgba(30,58,43,0.14); top:50%; left:50%; transform: translate(-50%,-50%);
  }
  .ring::after{
    content:""; position:absolute; inset: 9%; border-radius:50%;
    border:1px solid rgba(30,58,43,0.08);
  }

  .card{
    position:relative; z-index:1;
    max-width: 560px; width:100%; text-align:center;
    padding: 20px;
  }

  .logo{
    width: 92px; height:92px; border-radius:50%;
    margin: 0 auto 28px; overflow:hidden;
    box-shadow: 0 14px 34px -12px rgba(20,42,30,0.35);
    background: var(--paper);
  }
  .logo img{ width:100%; height:100%; object-fit:cover; display:block; }

  .eyebrow{
    font-size: 0.82rem; font-weight:600; letter-spacing: 0.02em;
    color: var(--pine); margin-bottom: 14px; display:block;
  }

  h1{
    font-family:'Lora',Georgia,serif; font-weight:500; line-height:1.15;
    font-size: clamp(2.1rem, 6vw, 3rem); color: var(--pine-deep); margin: 0 0 6px;
  }
  h1 em{ font-style:italic; font-weight:400; color: var(--pine); }

  .rule{ width:46px; height:3px; background: var(--gold); border-radius:2px; margin: 18px auto; }

  p.lede{
    font-size: 1.02rem; line-height:1.65; color: var(--ink-soft);
    max-width: 440px; margin: 0 auto 34px;
  }

  .notify{
    display:flex; max-width: 380px; margin: 0 auto; gap:0;
    border-radius:999px; overflow:hidden; border:1px solid rgba(30,58,43,0.22);
    background: var(--paper);
  }
  .notify input{
    flex:1; border:none; background:transparent; padding: 14px 18px;
    font-family:inherit; font-size:0.94rem; color: var(--ink); min-width:0;
  }
  .notify input:focus{ outline:none; }
  .notify button{
    border:none; background: var(--pine-deep); color: var(--cream);
    padding: 0 24px; font-family:inherit; font-weight:600; font-size:0.92rem;
    cursor:pointer; white-space:nowrap; transition: background .15s ease;
  }
  .notify button:hover{ background: var(--pine); }

  .confirm{ font-size:0.9rem; color: var(--pine-deep); font-weight:600; display:none; }
  .confirm.show{ display:block; }
  .notify.hide{ display:none; }

  .socials{ display:flex; justify-content:center; gap:14px; margin-top: 36px; }
  .socials a{
    width:38px; height:38px; border-radius:50%; border:1px solid rgba(30,58,43,0.2);
    display:flex; align-items:center; justify-content:center; color: var(--pine-deep);
    transition: background .15s ease, color .15s ease;
  }
  .socials a:hover{ background: var(--pine-deep); color: var(--cream); }
  .socials svg{ width:16px; height:16px; }

  footer{
    position:absolute; bottom: 22px; left:0; right:0; text-align:center;
    font-size: 0.78rem; color: var(--ink-soft);
  }

  @media (prefers-reduced-motion: no-preference){
    .card{ animation: fadeUp .6s ease both; }
  }
  @keyframes fadeUp{ from{ opacity:0; transform: translateY(10px);} to{ opacity:1; transform:translateY(0);} }
</style>
</head>
<body>

<div class="ring" aria-hidden="true"></div>

<main class="card">
  <div class="logo">
    <img src="assets/images/logo-mark.jpg" alt="Rooted Rupees logo">
  </div>

  <span class="eyebrow">Rooted Rupees</span>
  <h1>Something <em>rooted</em><br>is on its way.</h1>
  <div class="rule"></div>
  <p class="lede">We're building a home for investment advisory, research, financial planning and smart tools — everything you need to make confident financial decisions. Back soon.</p>

  <form class="notify" id="notify-form">
    <input type="email" placeholder="Enter your email" required aria-label="Email address">
    <button type="submit">Notify Me</button>
  </form>
  <p class="confirm" id="notify-confirm">Thanks — we'll let you know the moment we launch.</p>

  <div class="socials">
    <a href="#" aria-label="LinkedIn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4.98 3.5a2.5 2.5 0 11-.02 5 2.5 2.5 0 01.02-5zM3 8.98h4v12H3v-12zm7 0h3.8v1.64h.05c.53-1 1.83-2.06 3.77-2.06 4.03 0 4.78 2.65 4.78 6.1v6.32h-4v-5.6c0-1.34-.02-3.06-1.87-3.06-1.87 0-2.16 1.46-2.16 2.96v5.7h-4v-12z"/></svg></a>
    <a href="#" aria-label="Instagram"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1"/></svg></a>
    <a href="mailto:hello@rootedrupees.com" aria-label="Email"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg></a>
  </div>
</main>

<!-- <footer>© 2024 Rooted Rupees. All rights reserved.</footer> -->

<script>
  document.getElementById('notify-form').addEventListener('submit', function(e){
    e.preventDefault();
    this.classList.add('hide');
    document.getElementById('notify-confirm').classList.add('show');
    // Front-end only — wire this up to your email list (Mailchimp, etc.) when ready.
  });
</script>

</body>
</html>
